name: CI

on:
  pull_request:
  workflow_call:
    secrets:
      ECHO_LIBRARIES_ACCESS_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (windows)
    runs-on: cx-public-windows-x64
    env:
      GOPROXY: https://:${{ secrets.ECHO_LIBRARIES_ACCESS_KEY }}@golang.echohq.com
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
